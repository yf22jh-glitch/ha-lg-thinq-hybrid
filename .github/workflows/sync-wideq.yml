name: Sync vendored wideq

# Merge the pinned upstream baseline, local changes and upstream HEAD.
# Run the full integration tests here: bot PRs do not trigger Validate.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1" # weekly, Monday

permissions:
  contents: read

# NOTE: track af950833, NOT ollo69. Verified 2026-07-03: ollo69's core_async
# has a stale V2_APP_VER (5.0.1200) that LG's KR OAuth rejects (TokenError),
# while af950833 keeps it current (5.1.2600) and authenticates. af950833 is the
# fork actually maintained for KR accounts.
env:
  UPSTREAM_REPO: af950833/ha-smartthinq-sensors
  UPSTREAM_PATH: custom_components/smartthinq_sensors/wideq
  VENDOR_PATH: custom_components/my_lg/wideq

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout this repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Fetch upstream wideq
        id: up
        run: |
          git clone --filter=blob:none --no-checkout "https://github.com/${UPSTREAM_REPO}.git" /tmp/upstream
          sha="$(git -C /tmp/upstream rev-parse HEAD)"
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Merge upstream without losing local modules or patches
        env:
          UPSTREAM_SHA: ${{ steps.up.outputs.sha }}
        run: |
          python3 scripts/sync_wideq.py --upstream /tmp/upstream \
            --revision "$UPSTREAM_SHA" --output /tmp/wideq-candidate
          rsync -a --delete --exclude='__pycache__' \
            /tmp/wideq-candidate/wideq/ "${VENDOR_PATH}/"
          cp /tmp/wideq-candidate/wideq-upstream.json scripts/wideq-upstream.json

      - name: Build pinned local validation image
        run: docker build -t wideq-validation -f scripts/test-integration.Dockerfile scripts

      # Upstream Python executes without a network, host credentials or a Docker
      # socket. The checkout has no persisted token and remains read-only.
      - name: Test merged integration in isolation
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 256 --memory 1536m \
            --tmpfs /tmp:rw,nosuid,nodev,size=768m,mode=1777 \
            --mount "type=bind,src=$PWD,dst=/source,readonly" \
            -i wideq-validation python - <<'PY'
          import os, shutil, subprocess, sys
          shutil.copytree("/source", "/tmp/repo",
                          ignore=shutil.ignore_patterns(".git", "__pycache__", ".venv"))
          os.chdir("/tmp/repo")
          subprocess.run([sys.executable, "-m", "unittest", "discover", "-v", "-s", "tests"],
                         check=True)
          PY

      - name: Open PR if changed
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          branch: sync/wideq-upstream
          commit-message: "chore(wideq): sync from ${{ env.UPSTREAM_REPO }}@${{ steps.up.outputs.sha }}"
          title: "Sync vendored wideq from ${{ env.UPSTREAM_REPO }}"
          body: |
            Automated sync of `${{ env.VENDOR_PATH }}` from
            `${{ env.UPSTREAM_REPO }}` @ `${{ steps.up.outputs.sha }}`.

            Local extensions and patches were merged against the recorded upstream
            baseline. Conflicts stop the sync before any source is replaced.
            This workflow ran the full integration tests against HA 2026.9.4 in
            an isolated container. Bot-created PRs do not trigger Validate.
            Review decoding changes and device coverage before merging.
          labels: automated, wideq
          delete-branch: true
