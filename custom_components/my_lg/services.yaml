wideq_command:
  name: WideQ command
  description: >-
    Send an audited model-defined WideQ command. Unknown controls and fields are
    rejected locally. Operation, hazardous, and experimental commands remain
    locked by remote-control state and integration options.
  fields:
    device_id:
      name: Device ID or alias
      required: true
      selector:
        text:
    control:
      name: Control
      required: true
      selector:
        text:
    subdevice:
      name: Subdevice
      description: Optional washer or dryer target for a WashTower control.
      selector:
        select:
          options:
            - washer
            - dryer
    command:
      name: Command
      description: Optional model command, such as Set, Start, Stop, or Get.
      selector:
        text:
    data:
      name: Data
      description: Allowed field/value overrides from the audited model schema.
      selector:
        object:

local_read_consumer_transition:
  name: Local read contract installer transition
  description: >-
    Internal, administrator-only installer API. It changes only the durable
    read-contract acceptance state and never sends an appliance, cloud, or MQTT
    command. The installer supplies JIT binding generation and CAS values; do
    not call this service manually.
  fields:
    operation:
      name: Operation
      required: true
      selector:
        select:
          options:
            - inspect
            - bootstrap-v1
            - stage-v2
            - restore-staged-v1
            - adopt-v2
            - retire-v1
    binding_id:
      name: Binding ID
      required: true
      selector:
        text:
    binding_generation:
      name: Binding generation
      description: Required only for bootstrap-v1 and stage-v2; captured JIT.
      selector:
        number:
          min: 1
          mode: box
    expected_current_record_sha256:
      name: Expected current record SHA-256
      description: JIT CAS token from inspect or the preceding transition.
      selector:
        text:
